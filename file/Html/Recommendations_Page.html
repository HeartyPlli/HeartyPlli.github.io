<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Visitor recommendations for songs, movies, and series."><title>Recommendations | ArtheHeart</title><link rel="icon" href="../Image/Logo.png"><link rel="stylesheet" href="../CSS/cozy_portfolio.css?v=4"></head>
<body data-page="recommendations"><a class="skip-link" href="#main-content">Skip to main content</a><div id="site-header"></div>
<main id="main-content" class="page-main inner-page"><section class="page-banner"><div><p class="eyebrow" id="recommendations-mode">Recommendation status</p><h1>💌 Visitor Recommendations</h1><p>Leave a friendly media suggestion for the next visitor.</p></div></section>
  <section class="recommendations-layout feature-panel"><form id="recommendation-form" class="stacked-form"><h2>Recommend Something</h2><label for="visitor-name">Your name</label><input id="visitor-name" name="visitor-name" maxlength="30" required><label for="recommendation-type">Type</label><select id="recommendation-type" name="recommendation-type" required><option value="song">Song</option><option value="movie">Movie</option><option value="series">Series</option></select><label for="recommendation-title">Title</label><input id="recommendation-title" name="recommendation-title" maxlength="100" required><label for="recommendation-creator">Artist / Creator</label><input id="recommendation-creator" name="recommendation-creator" maxlength="100"><label for="recommendation-message">Optional message</label><textarea id="recommendation-message" name="recommendation-message" maxlength="300" rows="4"></textarea><div class="character-count"><span id="message-count">0</span>/300</div><button class="button primary" type="submit">Submit Recommendation</button><p class="status-message" id="recommendation-form-status" role="status"></p></form><div><h2>Latest Visitor Notes</h2><p class="status-message" id="recommendations-status" role="status">Loading recommendations…</p><div class="recommendation-feed" id="recommendation-feed"></div></div></section>
</main><div id="site-footer"></div><script type="module" src="../Js/app.js"></script></body></html>
